[package]
name = "deploy_lint"
version = "0.1.0"
edition = "2021"
description = "Scan deployment files for security and reliability mistakes"
license = "MIT"
readme = "README.md"

[[bin]]
name = "deploy-lint"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.8.26"
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "=2.0.12"
predicates = "3.1"
