apiVersion: v1
kind: Pod
metadata:
  name: demo
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
  containers:
    - name: demo
      image: busybox:1.36.1
      resources:
        limits:
          cpu: 50m
          memory: 64Mi
      readinessProbe:
        exec:
          command: ["true"]
