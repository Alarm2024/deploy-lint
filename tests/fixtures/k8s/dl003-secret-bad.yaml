apiVersion: v1
kind: Pod
metadata:
  name: secrets-bad
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
  containers:
    - name: app
      image: myapp:1.0.0
      env:
        - name: DB_PASSWORD
          value: literal-password-here
      resources:
        limits:
          memory: 128Mi
      readinessProbe:
        tcpSocket:
          port: 8080
