apiVersion: v1
kind: Pod
metadata:
  name: secrets-good
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
  containers:
    - name: app
      image: myapp:1.0.0
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db
              key: password
      resources:
        limits:
          memory: 128Mi
      readinessProbe:
        tcpSocket:
          port: 8080
