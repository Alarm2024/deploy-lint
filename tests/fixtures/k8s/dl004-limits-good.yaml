apiVersion: v1
kind: Pod
metadata:
  name: with-limits
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
  containers:
    - name: worker
      image: worker:2.3.4
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
      readinessProbe:
        exec:
          command: ["true"]
