apiVersion: v1
kind: Pod
metadata:
  name: with-probes
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
  containers:
    - name: api
      image: api:3.1.0
      resources:
        limits:
          memory: 256Mi
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080
