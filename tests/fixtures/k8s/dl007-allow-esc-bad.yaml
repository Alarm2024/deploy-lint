apiVersion: v1
kind: Pod
metadata:
  name: allow-esc-pod
spec:
  containers:
    - name: worker
      image: worker:2.0.1
      securityContext:
        allowPrivilegeEscalation: true
      resources:
        limits:
          memory: 256Mi
      livenessProbe:
        exec:
          command: ["true"]
